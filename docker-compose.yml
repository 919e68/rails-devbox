name: rails-devbox

services:
  dev:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    image: rails-devbox:latest
    container_name: ${BOX_NAME:-rails-devbox}
    hostname: ${BOX_NAME:-rails-devbox}
    working_dir: /home/dev/apps
    init: true
    restart: unless-stopped
    # App ports, databases, Redis, Mailpit and their connection settings are in docker-compose.override.yml
    environment:
      BINDING: "0.0.0.0"
      # Badge in the prompt and the Claude Code status line; set in .env
      BOX_NAME: ${BOX_NAME:-rails-devbox}
      BOX_COLOR: ${BOX_COLOR:-blue}
      # Taken from .env (or the shell) when set, so Claude Code starts logged in; left out otherwise
      CLAUDE_CODE_OAUTH_TOKEN:
      # Same for GitHub: gh reads it, and git over HTTPS uses it through gh (see Dockerfile)
      GH_TOKEN:
      # Jira / Confluence REST API access, also used tolog acli in (see entrypoint.sh)
      ATLASSIAN_SITE:
      ATLASSIAN_EMAIL:
      ATLASSIAN_API_TOKEN:
    volumes:
      # Host ./home is the container user's home: apps/, .ssh/, .claude/, dotfiles
      - ./home:/home/dev
      # Installed Ruby/Node versions and their gems/packages survive rebuilds
      - rbenv-versions:/opt/rbenv/versions
      - nvm-versions:/opt/nvm/versions
    stdin_open: true
    tty: true

networks:
  default:
    name: ${BOX_NAME:-rails-devbox}

volumes:
  rbenv-versions:
  nvm-versions:
